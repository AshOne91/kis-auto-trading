spec_version: "1"

project:
  name: KIS Auto Trading
  package_name: kis_auto_trading
  version: "0.1.0"
  description: AutoForge로 현대화하는 KIS 자동매매 FastAPI 서비스

application:
  framework: fastapi
  modules:
    - identity
    - account
  services:
    - name: session
      kind: redis_session
      namespace: kis_session
      ttl_seconds: 3600
      url_env: REDIS_URL
      mode: sentinel
      sentinel_urls_env: REDIS_SENTINEL_URLS
      sentinel_master: kis-session
  databases:
    - name: identity
      global_url_env: IDENTITY_DATABASE_URL
    - name: account
      shards:
        - shard_id: "1"
          url_env: ACCOUNT_SHARD_1_DATABASE_URL
        - shard_id: "2"
          url_env: ACCOUNT_SHARD_2_DATABASE_URL
