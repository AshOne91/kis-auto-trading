spec_version: "1"

# Default developer profile: lightweight single-process services. Use
# autoforge.ha.yaml only for deliberate high-availability drills.

tooling:
  kubernetes:
    enabled: true
    image: kis-auto-trading:latest
    secret_name: my-kis-gold-bar
    log_host_path: /run/desktop/mnt/host/c/kis-auto-trading/logs
    application_replicas: 1
    proxy_replicas: 1
    durable_job_worker_replicas: 1
  local_environment:
    enabled: true
    application_enabled: true
    postgres_mode: standalone
    rabbitmq_mode: standalone
    host_port_base: 49400
  single_host:
    enabled: true
    application_replicas: 1
    bootstrap_provider: windows_task_scheduler
  elk:
    enabled: false
    version: "8.19.17"
    host_port_base: 49600
    kubernetes_collector_enabled: false
  rag:
    enabled: false
    search_backend: opensearch
  external_provider:
    enabled: true
    url_environment: KIS_API_URL
    timeout_seconds: 5
    max_retries: 2
    retry_delay_seconds: 0.1
  distributed_lock:
    enabled: true
    mode: standalone
    url_environment: REDIS_URL
    key_prefix: kis-lock
    ttl_seconds: 30
  key_value_store:
    enabled: true
    mode: standalone
    url_environment: REDIS_URL
    key_prefix: kis-cache
    ttl_seconds: 86400
  ruff_exclude:
    - base_server
    - test.py

project:
  name: KIS Auto Trading
  package_name: kis_auto_trading
  version: "0.1.0"
  description: AutoForge로 현대화하는 KIS 자동매매 FastAPI 서비스
  dependencies:
    - "httpx>=0.28,<1"
    - "yfinance>=0.2,<1"

application:
  framework: fastapi
  control_plane_heartbeat:
    enabled: true
  runtime_environments:
    - name: KIS_API_URL
      health_test_value: https://example.invalid
      targets:
        - application
        - durable_job_worker
    - name: KIS_APP_KEY
      health_test_value: test-app-key
      targets:
        - application
        - durable_job_worker
    - name: KIS_APP_SECRET
      health_test_value: test-app-secret
      targets:
        - application
        - durable_job_worker
    - name: KIS_TOKEN_SCOPE
      required: false
      health_test_value: test-scope
      targets:
        - application
        - durable_job_worker
    - name: KIS_ACCOUNT_NUMBER
      health_test_value: "12345678"
    - name: KIS_ACCOUNT_PRODUCT_CODE
      health_test_value: "01"
    - name: KIS_ACCOUNT_ENVIRONMENT
      health_test_value: demo
  modules:
    - identity
    - account
    - news
    - market_data
    - signal
  services:
    - name: session
      kind: redis_session
      namespace: kis_session
      ttl_seconds: 3600
      url_env: REDIS_URL
      mode: standalone
    - name: domain_events
      kind: rabbitmq
      connection_url_env: RABBITMQ_URL
      exchange: kis.domain.events
      queue: kis.profile.events
      routing_key: account.profile.#
      dead_letter_exchange: kis.domain.events.dlx
      dead_letter_queue: kis.profile.events.dead-letter
      queue_type: classic
      prefetch_count: 32
      outbox_stores:
        - account
        - automation
  databases:
    - name: identity
      global_url_env: IDENTITY_DATABASE_URL
    - name: automation
      global_url_env: AUTOMATION_DATABASE_URL
    - name: account
      shards:
        - shard_id: "1"
          url_env: ACCOUNT_SHARD_1_DATABASE_URL
        - shard_id: "2"
          url_env: ACCOUNT_SHARD_2_DATABASE_URL
  durable_jobs:
    - name: news_collection
      store: automation
      event_type: news.collection.requested
      routing_key: news.collection.requested
      schedule: "0 * * * *"
    - name: news_index
      store: automation
      event_type: news.index.requested
      routing_key: news.index.requested
    - name: durable_job_history_index
      store: automation
      event_type: durable-job.history.index.requested
      routing_key: durable-job.history.index.requested
    - name: market_price_snapshot
      store: automation
      event_type: market-price.snapshot.requested
      routing_key: market-price.snapshot.requested
  service_tokens:
    - name: durable_jobs
      token_env: DURABLE_JOB_API_TOKEN
    - name: operator
      token_env: OPERATOR_API_TOKEN
