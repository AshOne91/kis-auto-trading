name: kis-scale-out-test

x-database-environment: &database-environment
  IDENTITY_DATABASE_URL: postgresql+asyncpg://kis_test:kis_test@identity-db:5432/identity
  AUTOMATION_DATABASE_URL: postgresql+asyncpg://kis_test:kis_test@automation-db:5432/automation
  ACCOUNT_SHARD_1_DATABASE_URL: postgresql+asyncpg://kis_test:kis_test@account-db-1:5432/account
  ACCOUNT_SHARD_2_DATABASE_URL: postgresql+asyncpg://kis_test:kis_test@account-db-2:5432/account
  LOG_DIRECTORY: /app/logs

x-api-environment: &api-environment
  <<: *database-environment
  APP_ENV: integration
  REDIS_CLUSTER_URL: redis://redis-node-1:6379
  DURABLE_JOB_API_TOKEN: ${DURABLE_JOB_API_TOKEN:?set DURABLE_JOB_API_TOKEN}

x-messaging-environment: &messaging-environment
  <<: *database-environment
  RABBITMQ_URL: amqp://kis_test:kis_test@rabbitmq:5672/

x-api: &api
  build:
    context: .
    dockerfile: Dockerfile
  environment: *api-environment
  depends_on:
    redis-cluster-init:
      condition: service_completed_successfully
    identity-db:
      condition: service_healthy
    automation-db:
      condition: service_healthy
    account-db-1:
      condition: service_healthy
    account-db-2:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
    interval: 3s
    timeout: 3s
    retries: 20
    start_period: 5s
  restart: unless-stopped

services:
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: kis_test
      RABBITMQ_DEFAULT_PASS: kis_test
      RABBITMQ_NODENAME: rabbit@rabbitmq
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./deploy/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s
    ports:
      - "15672:15672"
      - "15673:5672"

  redis-node-1: &redis-cluster-node
    image: redis:7-alpine
    command:
      - redis-server
      - --cluster-enabled
      - "yes"
      - --cluster-config-file
      - nodes.conf
      - --cluster-node-timeout
      - "5000"
      - --appendonly
      - "yes"
      - --cluster-announce-ip
      - 172.29.0.10
      - --cluster-announce-port
      - "6379"
      - --cluster-announce-bus-port
      - "16379"
    volumes:
      - redis-node-1-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
    ports:
      - "16379:6379"
    networks:
      default:
        ipv4_address: 172.29.0.10

  redis-node-2:
    <<: *redis-cluster-node
    command:
      - redis-server
      - --cluster-enabled
      - "yes"
      - --cluster-config-file
      - nodes.conf
      - --cluster-node-timeout
      - "5000"
      - --appendonly
      - "yes"
      - --cluster-announce-ip
      - 172.29.0.11
      - --cluster-announce-port
      - "6379"
      - --cluster-announce-bus-port
      - "16379"
    volumes:
      - redis-node-2-data:/data
    ports: []
    networks:
      default:
        ipv4_address: 172.29.0.11

  redis-node-3:
    <<: *redis-cluster-node
    command:
      - redis-server
      - --cluster-enabled
      - "yes"
      - --cluster-config-file
      - nodes.conf
      - --cluster-node-timeout
      - "5000"
      - --appendonly
      - "yes"
      - --cluster-announce-ip
      - 172.29.0.12
      - --cluster-announce-port
      - "6379"
      - --cluster-announce-bus-port
      - "16379"
    volumes:
      - redis-node-3-data:/data
    ports: []
    networks:
      default:
        ipv4_address: 172.29.0.12

  redis-node-4:
    <<: *redis-cluster-node
    command:
      - redis-server
      - --cluster-enabled
      - "yes"
      - --cluster-config-file
      - nodes.conf
      - --cluster-node-timeout
      - "5000"
      - --appendonly
      - "yes"
      - --cluster-announce-ip
      - 172.29.0.13
      - --cluster-announce-port
      - "6379"
      - --cluster-announce-bus-port
      - "16379"
    volumes:
      - redis-node-4-data:/data
    ports: []
    networks:
      default:
        ipv4_address: 172.29.0.13

  redis-node-5:
    <<: *redis-cluster-node
    command:
      - redis-server
      - --cluster-enabled
      - "yes"
      - --cluster-config-file
      - nodes.conf
      - --cluster-node-timeout
      - "5000"
      - --appendonly
      - "yes"
      - --cluster-announce-ip
      - 172.29.0.14
      - --cluster-announce-port
      - "6379"
      - --cluster-announce-bus-port
      - "16379"
    volumes:
      - redis-node-5-data:/data
    ports: []
    networks:
      default:
        ipv4_address: 172.29.0.14

  redis-node-6:
    <<: *redis-cluster-node
    command:
      - redis-server
      - --cluster-enabled
      - "yes"
      - --cluster-config-file
      - nodes.conf
      - --cluster-node-timeout
      - "5000"
      - --appendonly
      - "yes"
      - --cluster-announce-ip
      - 172.29.0.15
      - --cluster-announce-port
      - "6379"
      - --cluster-announce-bus-port
      - "16379"
    volumes:
      - redis-node-6-data:/data
    ports: []
    networks:
      default:
        ipv4_address: 172.29.0.15

  redis-cluster-init:
    image: redis:7-alpine
    command:
      - sh
      - -c
      - |
        known_nodes=$$(redis-cli -h 172.29.0.10 cluster info | awk -F: '/cluster_known_nodes/ {gsub("\r", "", $$2); print $$2}')
        if [ "$${known_nodes:-1}" -gt 1 ]; then
          until redis-cli -h 172.29.0.10 cluster info | grep -q 'cluster_state:ok'; do sleep 1; done
          echo 'Redis Cluster already configured'
          exit 0
        fi
        redis-cli --cluster create \
          172.29.0.10:6379 172.29.0.11:6379 172.29.0.12:6379 \
          172.29.0.13:6379 172.29.0.14:6379 172.29.0.15:6379 \
          --cluster-replicas 1 --cluster-yes
    depends_on:
      redis-node-1: {condition: service_healthy}
      redis-node-2: {condition: service_healthy}
      redis-node-3: {condition: service_healthy}
      redis-node-4: {condition: service_healthy}
      redis-node-5: {condition: service_healthy}
      redis-node-6: {condition: service_healthy}

  identity-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kis_test
      POSTGRES_PASSWORD: kis_test
      POSTGRES_DB: identity
    volumes:
      - identity-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kis_test -d identity"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "15432:5432"

  automation-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kis_test
      POSTGRES_PASSWORD: kis_test
      POSTGRES_DB: automation
    volumes:
      - automation-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kis_test -d automation"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "15435:5432"

  airflow-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kis_test
      POSTGRES_PASSWORD: kis_test
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kis_test -d airflow"]
      interval: 2s
      timeout: 3s
      retries: 30

  account-db-1:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kis_test
      POSTGRES_PASSWORD: kis_test
      POSTGRES_DB: account
    volumes:
      - account-db-1-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kis_test -d account"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "15433:5432"

  account-db-2:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kis_test
      POSTGRES_PASSWORD: kis_test
      POSTGRES_DB: account
    volumes:
      - account-db-2-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kis_test -d account"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "15434:5432"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    environment: *database-environment
    command: ["python", "scripts/migrate.py"]
    volumes:
      - type: bind
        source: ${LOG_ROOT:-./logs}/migrate
        target: /app/logs
    depends_on:
      identity-db:
        condition: service_healthy
      automation-db:
        condition: service_healthy
      account-db-1:
        condition: service_healthy
      account-db-2:
        condition: service_healthy

  outbox-relay:
    build:
      context: .
      dockerfile: Dockerfile
    environment: *messaging-environment
    command: ["python", "scripts/run_outbox_relay.py"]
    volumes:
      - type: bind
        source: ${LOG_ROOT:-./logs}/outbox-relay
        target: /app/logs
    depends_on:
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  message-worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment: *messaging-environment
    command: ["python", "scripts/run_message_worker.py"]
    volumes:
      - type: bind
        source: ${LOG_ROOT:-./logs}/message-worker
        target: /app/logs
    depends_on:
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  durable-job-worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment: *messaging-environment
    command: ["python", "scripts/run_durable_job_worker.py"]
    volumes:
      - type: bind
        source: ${LOG_ROOT:-./logs}/durable-job-worker
        target: /app/logs
    depends_on:
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow:
    image: apache/airflow:2.10.5-python3.12
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://kis_test:kis_test@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      DURABLE_JOB_API_URL: http://api-1:8000
      DURABLE_JOB_API_TOKEN: ${DURABLE_JOB_API_TOKEN:?set DURABLE_JOB_API_TOKEN}
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - airflow-home:/opt/airflow
    ports:
      - "18080:8080"
    command: standalone
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    depends_on:
      airflow-db:
        condition: service_healthy
      api-1:
        condition: service_healthy
      outbox-relay:
        condition: service_started
      durable-job-worker:
        condition: service_started

  api-1:
    <<: *api
    environment:
      <<: *api-environment
      INSTANCE_ID: api-1
    volumes:
      - type: bind
        source: ${LOG_ROOT:-./logs}/api-1
        target: /app/logs
    ports:
      - "18001:8000"

  api-2:
    <<: *api
    environment:
      <<: *api-environment
      INSTANCE_ID: api-2
    volumes:
      - type: bind
        source: ${LOG_ROOT:-./logs}/api-2
        target: /app/logs
    ports:
      - "18002:8000"

volumes:
  rabbitmq-data:
  redis-node-1-data:
  redis-node-2-data:
  redis-node-3-data:
  redis-node-4-data:
  redis-node-5-data:
  redis-node-6-data:
  identity-db-data:
  automation-db-data:
  airflow-db-data:
  account-db-1-data:
  account-db-2-data:
  airflow-home:

networks:
  default:
    ipam:
      config:
        - subnet: 172.29.0.0/24
          ip_range: 172.29.0.128/25
