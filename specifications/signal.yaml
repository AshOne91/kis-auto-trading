spec_version: "1"

module:
  name: signal
  display_name: Trading Signal
  route_prefix: /api/signal

endpoints:
  - name: subscribe
    method: PUT
    path: /subscription
    request:
      fields:
        - name: stock_code
          type:
            kind: string
    response:
      model: SignalSubscription
    handler: subscribe
    idempotency: true
    access_level: user
    dependencies:
      - current_session
      - database_session_registry
  - name: unsubscribe
    method: DELETE
    path: /subscription
    request:
      fields:
        - name: stock_code
          type:
            kind: string
    response:
      model: SignalSubscription
    handler: unsubscribe
    idempotency: true
    access_level: user
    dependencies:
      - current_session
      - database_session_registry

models:
  - name: SignalEvent
    fields:
      - name: signal_id
        type:
          kind: uuid
      - name: stock_code
        type:
          kind: string
      - name: direction
        type:
          kind: string
      - name: price
        type:
          kind: string
      - name: confidence
        type:
          kind: number
      - name: observed_at
        type:
          kind: datetime
      - name: expires_at
        type:
          kind: optional
          item:
            kind: datetime
  - name: SignalDeliveryIntent
    fields:
      - name: intent_id
        type:
          kind: uuid
      - name: signal_id
        type:
          kind: uuid
      - name: subscription_id
        type:
          kind: uuid
      - name: user_id
        type:
          kind: uuid
      - name: shard_id
        type:
          kind: string
      - name: stock_code
        type:
          kind: string
      - name: expires_at
        type:
          kind: datetime
      - name: status
        type:
          kind: string
        default: pending
  - name: SignalSubscription
    fields:
      - name: subscription_id
        type:
          kind: uuid
      - name: user_id
        type:
          kind: uuid
      - name: stock_code
        type:
          kind: string
      - name: enabled
        type:
          kind: boolean
        default: true
      - name: revision
        type:
          kind: integer
        default: 1
  - name: SignalSubscriptionProjection
    fields:
      - name: subscription_id
        type:
          kind: uuid
      - name: user_id
        type:
          kind: uuid
      - name: shard_id
        type:
          kind: string
      - name: stock_code
        type:
          kind: string
      - name: enabled
        type:
          kind: boolean
      - name: revision
        type:
          kind: integer

database:
  provider: agnostic
  tables:
    - name: signal_events
      columns:
        - name: signal_id
          type:
            kind: uuid
          primary_key: true
        - name: stock_code
          type:
            kind: string
          index: true
        - name: direction
          type:
            kind: string
        - name: price
          type:
            kind: string
        - name: confidence
          type:
            kind: number
        - name: observed_at
          type:
            kind: datetime
          index: true
        - name: expires_at
          type:
            kind: datetime
          nullable: true
          index: true
    - name: signal_delivery_intents
      columns:
        - name: intent_id
          type:
            kind: uuid
          primary_key: true
        - name: signal_id
          type:
            kind: uuid
          index: true
        - name: subscription_id
          type:
            kind: uuid
          index: true
        - name: user_id
          type:
            kind: uuid
          index: true
        - name: shard_id
          type:
            kind: string
        - name: stock_code
          type:
            kind: string
          index: true
        - name: expires_at
          type:
            kind: datetime
          index: true
        - name: status
          type:
            kind: string
          default: pending
    - name: signal_subscriptions
      columns:
        - name: subscription_id
          type:
            kind: uuid
          primary_key: true
        - name: user_id
          type:
            kind: uuid
          index: true
        - name: stock_code
          type:
            kind: string
          index: true
        - name: enabled
          type:
            kind: boolean
          default: true
        - name: revision
          type:
            kind: integer
          default: 1
    - name: signal_subscription_projections
      columns:
        - name: subscription_id
          type:
            kind: uuid
          primary_key: true
        - name: user_id
          type:
            kind: uuid
          index: true
        - name: shard_id
          type:
            kind: string
        - name: stock_code
          type:
            kind: string
          index: true
        - name: enabled
          type:
            kind: boolean
        - name: revision
          type:
            kind: integer
  repositories:
    - name: SignalEventRepository
      aggregate: SignalEvent
      table: signal_events
      operations:
        - find_by_id
        - save
    - name: SignalSubscriptionRepository
      aggregate: SignalSubscription
      table: signal_subscriptions
      operations:
        - find_by_id
        - save
    - name: SignalSubscriptionProjectionRepository
      aggregate: SignalSubscriptionProjection
      table: signal_subscription_projections
      operations:
        - find_by_id
        - save
    - name: SignalDeliveryIntentRepository
      aggregate: SignalDeliveryIntent
      table: signal_delivery_intents
      operations:
        - find_by_id
        - save
  migrations:
    - revision: 2
      name: signal_delivery_intent
      store: automation
      create_tables:
        - signal_delivery_intents
      add_columns:
        - table: signal_events
          column:
            name: expires_at
            type:
              kind: datetime
            nullable: true
            index: true
  placements:
    - table: signal_events
      store: automation
      mode: global
      unresolved_policy: error
    - table: signal_subscriptions
      store: account
      mode: sharded
      partition_key: user_id
      unresolved_policy: error
    - table: signal_subscription_projections
      store: automation
      mode: global
      unresolved_policy: error
    - table: signal_delivery_intents
      store: automation
      mode: global
      unresolved_policy: error
