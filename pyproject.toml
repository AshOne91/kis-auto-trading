[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kis_auto_trading"
version = "0.1.0"
description = "AutoForge로 현대화하는 KIS 자동매매 FastAPI 서비스"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.5,<10",
    "alembic>=1.18,<2",
    "asyncpg>=0.30,<1",
    "fastapi",
    "httpx>=0.28,<1",
    "redis>=5,<7",
    "sqlalchemy>=2.0,<3",
    "uvicorn",
    "httpx>=0.28,<1",
    "yfinance>=0.2,<1",
]

[project.optional-dependencies]
test = ["httpx", "pytest", "ruff"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["base_server", "test.py"]

[tool.ruff.lint.isort]
known-first-party = ["kis_auto_trading"]
