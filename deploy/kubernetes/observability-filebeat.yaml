apiVersion: v1
kind: ConfigMap
metadata:
  name: kis-auto-trading-filebeat-config
  namespace: default
data:
  filebeat.yml: |
    filebeat.inputs:
      - type: filestream
        id: kis-auto-trading-application-json
        paths:
          - /var/log/application/*/*.log
        parsers:
          - ndjson:
              target: ""
              add_error_key: true
    fields_under_root: true
    fields:
      autoforge.project: kis-auto-trading
      autoforge.environment: kubernetes
      kubernetes.node.name: ${NODE_NAME}
    output.elasticsearch:
      hosts: ["${ELASTICSEARCH_HOST:?Set ELASTICSEARCH_HOST}"]
      api_key: "${ELASTICSEARCH_API_KEY:?Set ELASTICSEARCH_API_KEY}"
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kis-auto-trading-filebeat
  namespace: default
  labels:
    app.kubernetes.io/name: kis-auto-trading
    app.kubernetes.io/component: log-collector
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kis-auto-trading
      app.kubernetes.io/component: log-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kis-auto-trading
        app.kubernetes.io/component: log-collector
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: filebeat
        image: docker.elastic.co/beats/filebeat:8.19.17
        imagePullPolicy: IfNotPresent
        args: ["-e", "--strict.perms=false"]
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: ELASTICSEARCH_HOST
          valueFrom:
            secretKeyRef:
              name: my-kis-gold-bar
              key: ELASTICSEARCH_HOST
        - name: ELASTICSEARCH_API_KEY
          valueFrom:
            secretKeyRef:
              name: my-kis-gold-bar
              key: ELASTICSEARCH_API_KEY
        volumeMounts:
        - name: filebeat-config
          mountPath: /usr/share/filebeat/filebeat.yml
          subPath: filebeat.yml
          readOnly: true
        - name: application-logs
          mountPath: /var/log/application
          readOnly: true
        - name: filebeat-data
          mountPath: /usr/share/filebeat/data
      volumes:
      - name: filebeat-config
        configMap:
          name: kis-auto-trading-filebeat-config
      - name: application-logs
        hostPath:
          path: /run/desktop/mnt/host/c/kis-auto-trading/logs
          type: DirectoryOrCreate
      - name: filebeat-data
        hostPath:
          path: /run/desktop/mnt/host/c/kis-auto-trading/logs/.filebeat-data
          type: DirectoryOrCreate
