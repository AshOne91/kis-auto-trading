name: kis_auto_trading-rag

services:
  qdrant:
    profiles: ["rag"]
    image: qdrant/qdrant:v1.18.3
    networks: [rag]
    ports:
      - "${LOCAL_BIND_ADDRESS:-127.0.0.1}:${QDRANT_HTTP_PORT:-49450}:6333"
      - "${LOCAL_BIND_ADDRESS:-127.0.0.1}:${QDRANT_GRPC_PORT:-49451}:6334"
    volumes:
      - qdrant-storage:/qdrant/storage

  opensearch:
    profiles: ["rag"]
    image: opensearchproject/opensearch:2.19.6
    networks: [rag]
    environment:
      discovery.type: single-node
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "${LOCAL_BIND_ADDRESS:-127.0.0.1}:${OPENSEARCH_PORT:-49460}:9200"
    volumes:
      - rag-opensearch-data:/usr/share/opensearch/data

  ollama:
    profiles: ["inference"]
    image: ollama/ollama:0.32.5
    networks: [rag]
    ports:
      - "${LOCAL_BIND_ADDRESS:-127.0.0.1}:${OLLAMA_PORT:-49470}:11434"
    volumes:
      - ollama-data:/root/.ollama

networks:
  rag:
    name: ${RAG_NETWORK_NAME:-kis_auto_trading-rag}
    external: true

volumes:
  qdrant-storage:
  rag-opensearch-data:
  ollama-data:
