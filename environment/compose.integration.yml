name: kis_auto_trading-integration

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autoforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: postgres
    ports:
      - "${LOCAL_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-25432}:5432"
    volumes:
      - ./postgres-init/00-databases.sql:/docker-entrypoint-initdb.d/00-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis-7000:
    image: redis:7-alpine
    command:
      - redis-server
      - --port
      - "7000"
      - --cluster-enabled
      - yes
      - --cluster-config-file
      - nodes.conf
      - --cluster-node-timeout
      - "5000"
      - --appendonly
      - no
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 7000 ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis-7001:
    image: redis:7-alpine
    command:
      - redis-server
      - --port
      - "7001"
      - --cluster-enabled
      - yes
      - --cluster-config-file
      - nodes.conf
      - --cluster-node-timeout
      - "5000"
      - --appendonly
      - no
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 7001 ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis-7002:
    image: redis:7-alpine
    command:
      - redis-server
      - --port
      - "7002"
      - --cluster-enabled
      - yes
      - --cluster-config-file
      - nodes.conf
      - --cluster-node-timeout
      - "5000"
      - --appendonly
      - no
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 7002 ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis-cluster-init:
    image: redis:7-alpine
    depends_on:
      redis-7000:
        condition: service_healthy
      redis-7001:
        condition: service_healthy
      redis-7002:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - >
        redis-cli -h redis-7000 -p 7000 cluster info | grep -q 'cluster_state:ok' ||
        redis-cli --cluster create redis-7000:7000 redis-7001:7001 redis-7002:7002
        --cluster-replicas 0 --cluster-yes
    restart: "no"

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-autoforge}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-change-me}
    ports:
      - "${LOCAL_BIND_ADDRESS:-127.0.0.1}:${RABBITMQ_AMQP_PORT:-25672}:5672"
      - "${LOCAL_BIND_ADDRESS:-127.0.0.1}:${RABBITMQ_MANAGEMENT_PORT:-25673}:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ${APPLICATION_IMAGE:-kis-auto-trading:local}
    pull_policy: never
    command: ["python", "scripts/migrate.py"]
    environment:
      IDENTITY_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-autoforge}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/identity
      AUTOMATION_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-autoforge}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/automation
      ACCOUNT_SHARD_1_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-autoforge}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/account_shard_1
      ACCOUNT_SHARD_2_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-autoforge}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/account_shard_2
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  application:
    image: ${APPLICATION_IMAGE:-kis-auto-trading:local}
    pull_policy: never
    environment:
      IDENTITY_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-autoforge}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/identity
      AUTOMATION_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-autoforge}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/automation
      ACCOUNT_SHARD_1_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-autoforge}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/account_shard_1
      ACCOUNT_SHARD_2_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-autoforge}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/account_shard_2
      REDIS_CLUSTER_URL: ${REDIS_CLUSTER_URL:-redis://redis-7000:7000}
      DURABLE_JOB_API_TOKEN: ${DURABLE_JOB_API_TOKEN:?set DURABLE_JOB_API_TOKEN}
      RAG_ELASTICSEARCH_URL: ${RAG_ELASTICSEARCH_URL:-http://elasticsearch:9200}
      RAG_OLLAMA_URL: ${RAG_OLLAMA_URL:-http://ollama:11434}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-embeddinggemma}
      LOG_DIRECTORY: /app/logs
    ports:
      - "${LOCAL_BIND_ADDRESS:-127.0.0.1}:${APPLICATION_PORT:-28000}:8000"
    volumes:
      - ../logs:/app/logs
    networks:
      - default
      - rag
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis-cluster-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 5s
      timeout: 3s
      retries: 20

  outbox-relay:
    image: ${APPLICATION_IMAGE:-kis-auto-trading:local}
    pull_policy: never
    command: ["python", "scripts/run_outbox_relay.py"]
    environment:
      IDENTITY_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-autoforge}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/identity
      AUTOMATION_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-autoforge}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/automation
      ACCOUNT_SHARD_1_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-autoforge}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/account_shard_1
      ACCOUNT_SHARD_2_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-autoforge}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/account_shard_2
      RABBITMQ_URL: ${RABBITMQ_URL:?set RABBITMQ_URL}
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  durable-job-worker:
    image: ${APPLICATION_IMAGE:-kis-auto-trading:local}
    pull_policy: never
    restart: unless-stopped
    command: ["python", "scripts/run_durable_job_worker.py"]
    environment:
      IDENTITY_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-autoforge}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/identity
      AUTOMATION_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-autoforge}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/automation
      ACCOUNT_SHARD_1_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-autoforge}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/account_shard_1
      ACCOUNT_SHARD_2_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-autoforge}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/account_shard_2
      RABBITMQ_URL: ${RABBITMQ_URL:?set RABBITMQ_URL}
      RAG_ELASTICSEARCH_URL: ${RAG_ELASTICSEARCH_URL:-http://elasticsearch:9200}
      RAG_OLLAMA_URL: ${RAG_OLLAMA_URL:-http://ollama:11434}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-embeddinggemma}
    networks:
      - default
      - rag
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  airflow:
    image: apache/airflow:2.10.5-python3.12
    depends_on:
      postgres:
        condition: service_healthy
      application:
        condition: service_healthy
      outbox-relay:
        condition: service_started
      durable-job-worker:
        condition: service_started
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-autoforge}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      DURABLE_JOB_API_URL: ${DURABLE_JOB_API_URL:-http://application:8000}
      DURABLE_JOB_API_TOKEN: ${DURABLE_JOB_API_TOKEN:?set DURABLE_JOB_API_TOKEN}
    volumes:
      - ../airflow/dags:/opt/airflow/dags:ro
      - airflow-home:/opt/airflow
    ports:
      - "${LOCAL_BIND_ADDRESS:-127.0.0.1}:${AIRFLOW_PORT:-28080}:8080"
    command: standalone
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

networks:
  rag:
    name: ${RAG_NETWORK_NAME:-kis_auto_trading-rag}
    external: true

volumes:
  airflow-home:
