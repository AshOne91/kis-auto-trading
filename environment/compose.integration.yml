name: kis_auto_trading-integration

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autoforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: postgres
    ports:
      - "${LOCAL_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-25432}:5432"
    volumes:
      - ./postgres-init/00-databases.sql:/docker-entrypoint-initdb.d/00-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis-7000:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --port
      - "7000"
      - --cluster-enabled
      - yes
      - --cluster-config-file
      - nodes.conf
      - --cluster-node-timeout
      - "5000"
      - --appendonly
      - yes
    volumes:
      - redis-7000-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 7000 ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis-7001:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --port
      - "7001"
      - --cluster-enabled
      - yes
      - --cluster-config-file
      - nodes.conf
      - --cluster-node-timeout
      - "5000"
      - --appendonly
      - yes
    volumes:
      - redis-7001-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 7001 ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis-7002:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --port
      - "7002"
      - --cluster-enabled
      - yes
      - --cluster-config-file
      - nodes.conf
      - --cluster-node-timeout
      - "5000"
      - --appendonly
      - yes
    volumes:
      - redis-7002-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 7002 ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis-7003:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --port
      - "7003"
      - --cluster-enabled
      - yes
      - --cluster-config-file
      - nodes.conf
      - --cluster-node-timeout
      - "5000"
      - --appendonly
      - yes
    volumes:
      - redis-7003-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 7003 ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis-7004:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --port
      - "7004"
      - --cluster-enabled
      - yes
      - --cluster-config-file
      - nodes.conf
      - --cluster-node-timeout
      - "5000"
      - --appendonly
      - yes
    volumes:
      - redis-7004-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 7004 ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis-7005:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --port
      - "7005"
      - --cluster-enabled
      - yes
      - --cluster-config-file
      - nodes.conf
      - --cluster-node-timeout
      - "5000"
      - --appendonly
      - yes
    volumes:
      - redis-7005-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 7005 ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis-cluster-init:
    image: redis:7-alpine
    depends_on:
      redis-7000:
        condition: service_healthy
      redis-7001:
        condition: service_healthy
      redis-7002:
        condition: service_healthy
      redis-7003:
        condition: service_healthy
      redis-7004:
        condition: service_healthy
      redis-7005:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |-
        if redis-cli -h redis-7000 -p 7000 cluster nodes | grep -q '[0-9]-[0-9]'; then
          for _ in $(seq 1 20); do
            topology=$(redis-cli -h redis-7000 -p 7000 cluster nodes)
            masters=$(printf '%s\n' "$$topology" | awk '$3 ~ /master/ && $8 == "connected" { count++ } END { print count + 0 }')
            replicas=$(printf '%s\n' "$$topology" | awk '$3 ~ /slave/ && $8 == "connected" { count++ } END { print count + 0 }')
            redis-cli -h redis-7000 -p 7000 cluster info | grep -q 'cluster_state:ok' && [ "$$masters" -eq 3 ] && [ "$$replicas" -eq 3 ] && exit 0
            sleep 1
          done
          echo 'existing Redis cluster did not meet the 3-primary/3-replica topology' >&2
          exit 1
        fi
        exec redis-cli --cluster create redis-7000:7000 redis-7001:7001 redis-7002:7002 redis-7003:7003 redis-7004:7004 redis-7005:7005 --cluster-replicas 1 --cluster-yes
    restart: "no"

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-autoforge}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-change-me}
    ports:
      - "${LOCAL_BIND_ADDRESS:-127.0.0.1}:${RABBITMQ_AMQP_PORT:-25672}:5672"
      - "${LOCAL_BIND_ADDRESS:-127.0.0.1}:${RABBITMQ_MANAGEMENT_PORT:-25673}:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ${APPLICATION_IMAGE:-kis-auto-trading:local}
    pull_policy: never
    command: ["python", "scripts/migrate.py"]
    environment:
      IDENTITY_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-autoforge}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/identity
      AUTOMATION_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-autoforge}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/automation
      ACCOUNT_SHARD_1_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-autoforge}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/account_shard_1
      ACCOUNT_SHARD_2_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-autoforge}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/account_shard_2
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  application:
    image: ${APPLICATION_IMAGE:-kis-auto-trading:local}
    pull_policy: never
    restart: unless-stopped
    environment:
      IDENTITY_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-autoforge}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/identity
      AUTOMATION_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-autoforge}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/automation
      ACCOUNT_SHARD_1_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-autoforge}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/account_shard_1
      ACCOUNT_SHARD_2_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-autoforge}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/account_shard_2
      REDIS_CLUSTER_URL: ${REDIS_CLUSTER_URL:-redis://redis-7000:7000}
      REDIS_CLUSTER_STARTUP_NODES: ${REDIS_CLUSTER_STARTUP_NODES:-redis://redis-7000:7000,redis://redis-7001:7001,redis://redis-7002:7002,redis://redis-7003:7003,redis://redis-7004:7004,redis://redis-7005:7005}
      DURABLE_JOB_API_TOKEN: ${DURABLE_JOB_API_TOKEN:?set DURABLE_JOB_API_TOKEN}
      RAG_SEARCH_BACKEND: ${RAG_SEARCH_BACKEND:-opensearch}
      RAG_SEARCH_URL: ${RAG_SEARCH_URL:-http://opensearch:9200}
      RAG_OLLAMA_URL: ${RAG_OLLAMA_URL:-http://ollama:11434}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-embeddinggemma}
      LOG_DIRECTORY: /app/logs
    ports:
      - "${LOCAL_BIND_ADDRESS:-127.0.0.1}:${APPLICATION_PORT:-28000}:8000"
    volumes:
      - ../logs:/app/logs
    networks:
      - default
      - rag
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis-cluster-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; import socket; import asyncio, os; from urllib.parse import urlparse; from redis.cluster import ClusterNode; from redis.asyncio.cluster import RedisCluster; urlopen('http://127.0.0.1:8000/health').read(); [socket.create_connection(target, 2).close() for target in [('postgres', 5432)]]; startup_nodes=[ClusterNode(urlparse(value).hostname, urlparse(value).port or 6379) for value in os.environ['REDIS_CLUSTER_STARTUP_NODES'].split(',')]; client=RedisCluster.from_url(os.environ['REDIS_CLUSTER_URL'], startup_nodes=startup_nodes, decode_responses=True, require_full_coverage=True); asyncio.run(client.ping())"]
      interval: 5s
      timeout: 3s
      retries: 20

  outbox-relay:
    image: ${APPLICATION_IMAGE:-kis-auto-trading:local}
    pull_policy: never
    restart: unless-stopped
    command: ["python", "scripts/run_outbox_relay.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import asyncio, os, aio_pika; connection = asyncio.run(aio_pika.connect(os.environ['RABBITMQ_URL'], timeout=2)); asyncio.run(connection.close())"]
      interval: 10s
      timeout: 3s
      retries: 3
    environment:
      IDENTITY_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-autoforge}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/identity
      AUTOMATION_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-autoforge}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/automation
      ACCOUNT_SHARD_1_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-autoforge}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/account_shard_1
      ACCOUNT_SHARD_2_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-autoforge}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/account_shard_2
      RABBITMQ_URL: ${RABBITMQ_URL:?set RABBITMQ_URL}
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  durable-job-worker:
    image: ${APPLICATION_IMAGE:-kis-auto-trading:local}
    pull_policy: never
    restart: "unless-stopped"
    command: ["python", "scripts/run_durable_job_worker.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import asyncio, os, aio_pika; connection = asyncio.run(aio_pika.connect(os.environ['RABBITMQ_URL'], timeout=2)); asyncio.run(connection.close())"]
      interval: 10s
      timeout: 3s
      retries: 3
    environment:
      IDENTITY_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-autoforge}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/identity
      AUTOMATION_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-autoforge}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/automation
      ACCOUNT_SHARD_1_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-autoforge}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/account_shard_1
      ACCOUNT_SHARD_2_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-autoforge}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/account_shard_2
      RABBITMQ_URL: ${RABBITMQ_URL:?set RABBITMQ_URL}
      RAG_SEARCH_BACKEND: ${RAG_SEARCH_BACKEND:-opensearch}
      RAG_SEARCH_URL: ${RAG_SEARCH_URL:-http://opensearch:9200}
      RAG_OLLAMA_URL: ${RAG_OLLAMA_URL:-http://ollama:11434}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-embeddinggemma}
    networks:
      - default
      - rag
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  airflow-init:
    image: apache/airflow:2.10.5-python3.12
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-autoforge}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      DURABLE_JOB_API_URL: ${DURABLE_JOB_API_URL:-http://application:8000}
      DURABLE_JOB_API_TOKEN: ${DURABLE_JOB_API_TOKEN:?set DURABLE_JOB_API_TOKEN}
    volumes:
      - ../airflow/dags:/opt/airflow/dags:ro
      - airflow-home:/opt/airflow
    command: ["airflow", "db", "migrate"]

  airflow-webserver:
    image: apache/airflow:2.10.5-python3.12
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-autoforge}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      DURABLE_JOB_API_URL: ${DURABLE_JOB_API_URL:-http://application:8000}
      DURABLE_JOB_API_TOKEN: ${DURABLE_JOB_API_TOKEN:?set DURABLE_JOB_API_TOKEN}
    volumes:
      - ../airflow/dags:/opt/airflow/dags:ro
      - airflow-home:/opt/airflow
    ports:
      - "${LOCAL_BIND_ADDRESS:-127.0.0.1}:${AIRFLOW_PORT:-28080}:8080"
    command: webserver
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  airflow-scheduler:
    image: apache/airflow:2.10.5-python3.12
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      application:
        condition: service_healthy
      outbox-relay:
        condition: service_started
      durable-job-worker:
        condition: service_started
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-autoforge}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      DURABLE_JOB_API_URL: ${DURABLE_JOB_API_URL:-http://application:8000}
      DURABLE_JOB_API_TOKEN: ${DURABLE_JOB_API_TOKEN:?set DURABLE_JOB_API_TOKEN}
    volumes:
      - ../airflow/dags:/opt/airflow/dags:ro
      - airflow-home:/opt/airflow
    command: scheduler
    restart: unless-stopped

networks:
  rag:
    name: ${RAG_NETWORK_NAME:-kis_auto_trading-rag}
    external: true

volumes:
  redis-7000-data:
  redis-7001-data:
  redis-7002-data:
  redis-7003-data:
  redis-7004-data:
  redis-7005-data:
  airflow-home:
